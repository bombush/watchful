<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Watchful Player</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0f0e0b; color: #f0ede4; font-family: 'Courier New', monospace; }
    .layout { display: flex; flex-direction: column; height: 100vh; }
    .header {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 14px 20px; border-bottom: 0.5px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }
    .meta { flex: 1; min-width: 0; }
    .channel { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #6b6860; margin-bottom: 4px; }
    .title { font-family: Georgia, serif; font-size: 16px; font-weight: 500; line-height: 1.4; color: #f0ede4; }
    .back-btn {
      background: none; border: 0.5px solid rgba(255,255,255,0.12); border-radius: 6px;
      color: #a09e99; cursor: pointer; padding: 6px 12px; font-size: 11px;
      font-family: inherit; white-space: nowrap; flex-shrink: 0;
      transition: color 0.12s, border-color 0.12s; text-decoration: none;
      display: flex; align-items: center;
    }
    .back-btn:hover { color: #f0ede4; border-color: rgba(255,255,255,0.25); }
    .player-wrap { flex: 1; position: relative; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <div class="layout">
    <div class="header">
      <div class="meta">
        <p class="channel" id="channel"></p>
        <p class="title" id="title">Loading…</p>
      </div>
      <button class="back-btn" id="close-btn">✕ close</button>
    </div>
    <div class="player-wrap">
      <iframe id="player" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture; web-share"></iframe>
    </div>
  </div>
  
    <script src="player.js"></script>
  
</body>
</html>
